<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Photography</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }
        nav {
            text-align: center;
            padding: 10px;
            background: #444;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 18px;
            display: inline-block;
        }
        .hero {
            text-align: center;
            padding: 50px;
            background: url('hero-image.jpg') no-repeat center center/cover;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
        .gallery {
            text-align: center;
            padding: 20px;
        }
        .gallery img {
            width: 300px;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        .about-me {
            background: white;
            text-align: center;
            padding: 30px;
            margin: 20px;
            border-radius: 10px;
        }
        .about-me img {
            width: 200px;
            border-radius: 50%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>Wedding Photography</header>
    <nav>
        <a href="home.html">Home</a>
        <a href="booking.html">Booking</a>
    </nav>

    <div class="hero">
        Capturing Your Special Moments with Elegance & Passion
    </div>

    <div class="gallery">
        <h2>My Work</h2>
        <img src="photo1.jpg" alt="Wedding Photo 1">
        <img src="photo2.jpg" alt="Wedding Photo 2">
        <img src="photo3.jpg" alt="Wedding Photo 3">
    </div>

    <div class="about-me">
        <h2>About Me</h2>
        <p>Hi, I'm [Your Name], a passionate wedding photographer. I believe every couple has a unique love story, and my goal is to capture it beautifully.</p>
        <img src="profile.jpg" alt="Photographer">
    </div>
</body>
</html>
